# Test cargo buckal init/new commands across platforms
#
# This workflow tests the init and new subcommands with various flags.

name: Test init/new commands

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_init_new_commands:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-14
          - name: windows
            os: windows-2022

    steps:
      - name: Set cargo target dir
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"

      - name: Checkout cargo-buckal
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: cargo-buckal

      - name: Setup Windows environment
        uses: ./cargo-buckal/.github/actions/setup-windows

      - name: Setup Rust toolchains
        uses: ./cargo-buckal/.github/actions/setup-rust-toolchains

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cargo-buckal -> target
          cache-all-crates: true

      - name: Install cargo-buckal
        shell: bash
        run: |
          cd cargo-buckal
          cargo install --locked --path .

      - name: Install Buck2
        shell: bash
        env:
          # Unauthenticated requests to api.github.com share a small
          # per-address quota with every other job on the runner, so the
          # release lookup can fail with HTTP 403 for reasons unrelated
          # to this repository. The workflow token carries its own,
          # larger quota.
          # https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo buckal setup -y

      - name: Test cargo buckal init --repo
        shell: bash
        run: |
          mkdir -p test-init-repo && cd test-init-repo
          cargo buckal init --repo
          test -d toolchains
          test -d platforms
          test -f toolchains/BUCK
          test -f platforms/BUCK
          test -f .buckconfig

      - name: Test cargo buckal init --lite
        shell: bash
        run: |
          mkdir -p test-init-lite && cd test-init-lite
          cargo buckal init --lite
          test -d toolchains
          test -d platforms
          test -f toolchains/BUCK
          test -f platforms/BUCK
          test -f .buckconfig

      - name: Test cargo buckal new --repo
        shell: bash
        run: |
          cargo buckal new test-new-repo --repo
          test -d test-new-repo/toolchains
          test -d test-new-repo/platforms
          test -f test-new-repo/toolchains/BUCK
          test -f test-new-repo/platforms/BUCK
          test -f test-new-repo/.buckconfig

      - name: Test cargo buckal new --lite
        shell: bash
        run: |
          cargo buckal new test-new-lite --lite
          test -d test-new-lite/toolchains
          test -d test-new-lite/platforms
          test -f test-new-lite/toolchains/BUCK
          test -f test-new-lite/platforms/BUCK
          test -f test-new-lite/.buckconfig

      # A build-script executable links its `[build-dependencies]` closure. When
      # that closure reaches a crate shipping a prebuilt import library, the link
      # needs the `-L` search path that crate's own build script prints, exactly
      # as a runtime link does. Without it the build script compiles and fails to
      # link, and `cargo buckal check` cannot catch it because it does not link.
      #
      # Windows-only: the failure is a linker error against a `.lib` that exists
      # on no other platform.
      - name: Test a build script that links an import library
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p test-buildscript-link/src && cd test-buildscript-link

          # `windows-sys` is pinned deliberately. 0.52 reaches the system import
          # libraries through windows_x86_64_msvc, which ships a prebuilt
          # windows.0.52.0.lib. Later versions go through windows-link and ship
          # none, so the link would succeed either way and prove nothing.
          cat > Cargo.toml <<'EOF'
          [package]
          name = "test-buildscript-link"
          version = "0.1.0"
          edition = "2021"

          [build-dependencies]
          windows-sys = { version = "=0.52.0", features = ["Win32_Foundation"] }
          EOF

          cat > build.rs <<'EOF'
          fn main() {
              // Forces the build script's own link to resolve a symbol out of
              // the prebuilt import library.
              let err = unsafe { windows_sys::Win32::Foundation::GetLastError() };
              println!("cargo:rustc-env=FIXTURE_LAST_ERROR={err}");
          }
          EOF

          echo 'fn main() { println!("built ok"); }' > src/main.rs

          cargo generate-lockfile
          cargo buckal migrate --init .
          # Fails `LNK1181: cannot open input file 'windows.0.52.0.lib'` when the
          # search path does not reach the build script's link.
          cargo buckal build --all-targets
